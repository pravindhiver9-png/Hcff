name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android project (keeps our lib/)
        run: |
          cp -r lib /tmp/lib_backup
          flutter create --platforms=android --project-name hamari_chit_fund --org com.hamari.chitfund .
          rm -rf lib && cp -r /tmp/lib_backup lib
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="चिट फंड फैमिली"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hamari-chit-fund-apk
          path: build/app/outputs/flutter-apk/app-release.apk
