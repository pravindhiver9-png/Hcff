name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files and set SDK 34
        run: |
          flutter create --platforms=android --org com.hcff2 --project-name hamari_chit_fund /tmp/gen
          rm -rf android
          cp -r /tmp/gen/android ./android

          python3 - <<'EOF'
          from pathlib import Path
          import re

          # 1. App ki gradle files mein SDK 34
          for p in Path("android").rglob("build.gradle*"):
              txt = p.read_text(encoding="utf-8")
              txt = re.sub(r'compileSdk\s*=?\s*[^\n]+', 'compileSdk = 34', txt)
              txt = re.sub(r'compileSdkVersion\s+[^\n]+', 'compileSdkVersion 34', txt)
              txt = re.sub(r'targetSdk\s*=?\s*[^\n]+', 'targetSdk = 34', txt)
              txt = re.sub(r'targetSdkVersion\s+[^\n]+', 'targetSdkVersion 34', txt)
              p.write_text(txt, encoding="utf-8")

          # 2. Saare plugins (printing wagairah) ko bhi SDK 34 se build karao
          bg = Path("android/build.gradle")
          t = bg.read_text(encoding="utf-8")
          fix = (
              "subprojects {\n"
              "    afterEvaluate { project ->\n"
              "        if (project.hasProperty('android')) {\n"
              "            project.android {\n"
              "                compileSdkVersion 34\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "}\n\n"
          )
          pattern = re.compile(r"subprojects\s*\{\s*project\.evaluationDependsOn\(':app'\)\s*\}")
          m = pattern.search(t)
          if m:
              t = t[:m.start()] + fix + t[m.start():]
          else:
              t = fix + t
          bg.write_text(t, encoding="utf-8")

          # 3. gradle.properties
          gradle_props = Path("android/gradle.properties")
          if gradle_props.exists():
              gtxt = gradle_props.read_text(encoding="utf-8")
              if "android.suppressUnsupportedCompileSdk" not in gtxt:
                  gtxt += "\nandroid.suppressUnsupportedCompileSdk=34\n"
              gradle_props.write_text(gtxt, encoding="utf-8")
          EOF

          echo "----- android/build.gradle -----"
